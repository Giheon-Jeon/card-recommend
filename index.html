    <!-- FOUC 방지 초기 테마 적용 스크립트 (CSP hash 동기화 유지) -->
    <script>(function(){try{var s=localStorage.getItem('theme-mode'),d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;if(s==='dark'||((!s||s==='system')&&d)){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
